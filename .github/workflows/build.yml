name: ESP32 Build

on:
  push:
    branches: [ "main", "v*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug build'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          wget \
          flex \
          bison \
          gperf \
          cmake \
          ninja-build \
          ccache \
          libffi-dev \
          libssl-dev \
          dfu-util
    
    - name: Install Python Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install \
          virtualenv \
          pip \
          setuptools
    
    - name: Cache ESP-IDF
      uses: actions/cache@v3
      with:
        path: |
          ~/.espressif
          ~/.cache/pip
        key: ${{ runner.os }}-esp-idf-${{ hashFiles('sdkconfig*') }}
        restore-keys: |
          ${{ runner.os }}-esp-idf-
    
    - name: Install ESP-IDF
      run: |
        mkdir -p ~/.espressif
        wget https://dl.espressif.com/dl/esp-idf/releases/esp-idf-v5.4.tar.gz
        tar -xzf esp-idf-v5.4.tar.gz
        mv esp-idf-v5.4 ~/.espressif/esp-idf
        cd ~/.espressif/esp-idf
        ./install.sh esp32s3
        . ./export.sh
    
    - name: Build Project
      run: |
        . ~/.espressif/esp-idf/export.sh
        idf.py reconfigure
        idf.py build
        
    - name: Archive build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: firmware
        path: |
          build/*.bin
          build/*.elf
          build/*.map
          
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/*.bin
          build/*.elf
          build/*.map
        draft: false
        prerelease: false